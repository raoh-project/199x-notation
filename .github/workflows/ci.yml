name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The inputs are the files the checksums were taken of.
      - name: Check the UCD files against their checksums
        working-directory: ucd/18.0.0
        run: sha256sum --check --strict SHA256SUMS
      # The checked-in tables are what the generators write from those inputs.
      - name: Regenerate the tables
        run: |
          java gen/GenerateCaseTables.java ucd/18.0.0
          java gen/GenerateNormalizationTables.java ucd/18.0.0
          git diff --exit-code
      - name: Test
        working-directory: java
        run: mvn --batch-mode test
